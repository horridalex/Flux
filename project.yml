name: Flux
options:
  bundleIdPrefix: com.personal
  deploymentTarget:
    iOS: "17.0"
  # Builds the WireGuard server (Go) into WireGuard/build/FluxWG.xcframework. Skips when unchanged.
  preGenCommand: scripts/build-wireguard.sh
settings:
  base:
    # Your team ID, from Xcode > Settings > Accounts, to build for an iPhone from Xcode. Empty is
    # enough for the simulator and for the unsigned IPA (build-ipa.yml) that you sign yourself.
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    # The app's bundle ID, the same as the IPA that build-ipa.yml makes. Pass APP_BUNDLE_ID to
    # xcodebuild to change it. A new one installs a second Flux with new keys.
    APP_BUNDLE_ID: com.personal.flux
    MARKETING_VERSION: "1.1"
    CURRENT_PROJECT_VERSION: "1" # the built app gets the commit count instead, see postBuildScripts
targets:
  Flux:
    type: application
    platform: iOS
    sources: [Sources, Shared]
    dependencies:
      - framework: WireGuard/build/FluxWG.xcframework
        embed: false # a static library, linked into the app
      - target: FluxWidgets # embedded in the app's PlugIns
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: Flux
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Flux accepts connections from your devices on the hotspot network.
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    # The build number is the commit count, so each build on the iPhone can be told apart
    # (Settings > General > iPhone Storage > Flux). It runs before Xcode signs the app.
    postBuildScripts:
      - name: Build number from git
        basedOnDependencyAnalysis: false
        # The processed Info.plist as input makes it wait for Xcode to write that file.
        # Without it the two can run in parallel, and Xcode overwrites the number.
        inputFiles:
          - $(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)
        script: |
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $(git -C "$SRCROOT" rev-list --count HEAD)" \
            "$TARGET_BUILD_DIR/$INFOPLIST_PATH"
    info:
      path: Sources/Info.plist
      properties:
        UIBackgroundModes: [audio]
        NSSupportsLiveActivities: true
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
  # The Live Activity and the Control Center button. iOS 18 and later, for the control; the app
  # itself still runs on iOS 17, without them.
  FluxWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - Widgets
      - Shared
      - Sources/Format.swift
      - Sources/Theme.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).widgets
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Widgets/Info.plist
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) WIDGET_EXTENSION
        SKIP_INSTALL: YES
    # The same build number as the app, which iOS expects of an extension.
    postBuildScripts:
      - name: Build number from git
        basedOnDependencyAnalysis: false
        inputFiles:
          - $(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)
        script: |
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $(git -C "$SRCROOT" rev-list --count HEAD)" \
            "$TARGET_BUILD_DIR/$INFOPLIST_PATH"
  FluxUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: Flux
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.personal.flux.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Flux:
    build:
      targets:
        Flux: all
    run:
      config: Debug
    test:
      config: Debug
      targets: [FluxUITests]
