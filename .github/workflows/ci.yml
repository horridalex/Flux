# Runs on a GitHub-hosted Mac, since building an iOS app needs Xcode. In a private repository a
# macOS minute counts ten times against the free Actions minutes, so it runs for pull requests and
# main, not for every branch push. Actions > CI > Run workflow runs it on any branch.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call: # release.yml runs it before it builds

permissions:
  contents: read

concurrency:
  # The workflow is the caller's when release.yml runs this, so a release's tests and a push's
  # don't cancel each other.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash # named explicitly, so steps run with pipefail and a failed build can't hide behind tail

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the build number is the commit count, see project.yml
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: WireGuard/go.mod
          cache-dependency-path: WireGuard/go.sum
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build the WireGuard server
        run: scripts/build-wireguard.sh # swift test links its macOS slice
      - name: Unit tests
        run: swift test
      - name: WireGuard server tests
        run: go -C WireGuard test -race ./...
      - name: Fuzz the UDP replies
        run: go -C WireGuard test -run '^$' -fuzz FuzzReplyPackets -fuzztime 30s ./...
      # Fails only on a known vulnerability that Flux's code can reach. Pinned, like the actions.
      - name: Known vulnerabilities
        run: go -C WireGuard run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: Build the app
        run: |
          xcodegen generate --quiet
          xcodebuild -project Flux.xcodeproj -scheme Flux \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/dd" build | tail -3
