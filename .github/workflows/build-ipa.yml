# Actions > Build IPA > Run workflow. Builds an unsigned Release IPA to sign with your own
# certificate (a signing app, Sideloadly, AltStore...) and install without a Mac. See the README.
name: Build IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45

    defaults:
      run:
        shell: bash

    steps:
      - name: Download source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: WireGuard/go.mod
          cache-dependency-path: WireGuard/go.sum

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate # builds the WireGuard server with Go first

      - name: Build unsigned app
        run: |
          set -o pipefail
          xcodebuild \
            -project Tether.xcodeproj \
            -scheme Tether \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/TetherBuild" \
            APP_BUNDLE_ID=com.personal.tether \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build 2>&1 | tee "$RUNNER_TEMP/tether-build.log"

      - name: Package IPA
        run: |
          mkdir -p "$RUNNER_TEMP/TetherIPA/Payload"
          ditto \
            "$RUNNER_TEMP/TetherBuild/Build/Products/Release-iphoneos/Tether.app" \
            "$RUNNER_TEMP/TetherIPA/Payload/Tether.app"
          cd "$RUNNER_TEMP/TetherIPA"
          /usr/bin/zip -qry Tether-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Tether-unsigned
          path: ${{ runner.temp }}/TetherIPA/Tether-unsigned.ipa
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Tether-build-log
          path: ${{ runner.temp }}/tether-build.log
          if-no-files-found: ignore
