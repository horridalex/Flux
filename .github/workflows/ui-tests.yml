# Actions > UI tests > Run workflow. The full XCUITest suite takes about 18 minutes, so it runs on
# demand and not on every push. It runs on a GitHub-hosted Mac and boots its own simulator.
name: UI tests

on:
  workflow_dispatch:
    inputs:
      only:
        description: Run only these, like FluxUITests/AccessibilityTests (empty runs them all)
        required: false
        default: ""

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  ui-tests:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: WireGuard/go.mod
          cache-dependency-path: WireGuard/go.sum
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Create a simulator
        run: |
          runtime=$(xcrun simctl list runtimes iOS -j | python3 -c 'import json, sys; r = [x for x in json.load(sys.stdin)["runtimes"] if x["isAvailable"]]; print(r[-1]["identifier"])')
          id=$(xcrun simctl create "Flux CI $GITHUB_RUN_ID" com.apple.CoreSimulator.SimDeviceType.iPhone-16 "$runtime")
          echo "SIM=$id" >> "$GITHUB_ENV"
      - name: UI tests
        env:
          ONLY: ${{ inputs.only }}
        run: |
          xcodegen generate --quiet
          only=()
          if [[ -n $ONLY ]]; then only=(-only-testing:"$ONLY"); fi
          xcodebuild test -project Flux.xcodeproj -scheme Flux -destination "id=$SIM" "${only[@]}" \
            -derivedDataPath "$RUNNER_TEMP/dd" -resultBundlePath "$RUNNER_TEMP/UITests.xcresult" \
            | grep -E "Test Case .* failed|Executed [0-9]+ tests|error:|Audit issue|TEST (SUCCEEDED|FAILED)"
      - name: Delete the simulator
        if: always() && env.SIM != ''
        run: xcrun simctl delete "$SIM"
